<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meal Craft — rustic kitchen candidates</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: "Montserrat", system-ui, sans-serif;
      background: #f7f6f3;
      color: #262a22;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 1rem 1.25rem;
      background: rgba(247, 246, 243, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e5e7eb;
    }
    h1 { margin: 0; font-size: 1.1rem; }
    p { margin: 0.35rem 0 0; color: #555; font-size: 0.9rem; }
    main {
      display: grid;
      gap: 1.5rem;
      padding: 1.25rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    figure {
      margin: 0;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(38, 42, 34, 0.08);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #ddd;
    }
    figcaption {
      padding: 0.85rem 1rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
    }
    figcaption span {
      display: block;
      margin-top: 0.25rem;
      font-weight: 500;
      color: #555;
      font-size: 0.85rem;
    }
    .rec { color: #6e8c47; }
  </style>
</head>
<body>
  <header>
    <h1>Rustic kitchen hero candidates</h1>
    <p>Not applied to the homepage yet — tell me a number (00–05) when you pick one. Best for phone-left / copy-right: <strong class="rec">01, 03, 05</strong>.</p>
  </header>
  <main>
    <figure>
      <img src="./00-existing-illustrative-kitchen.png" alt="00 existing illustrative kitchen" />
      <figcaption>00 — Existing illustrative kitchen<span>Warm sketch style; plants + produce; different medium than photo</span></figcaption>
    </figure>
    <figure>
      <img src="./01-rustic-produce-plants.jpg" alt="01 rustic produce and plants" />
      <figcaption>01 — Rustic produce &amp; plants<span class="rec">Recommended — open left wall for phone overlay</span></figcaption>
    </figure>
    <figure>
      <img src="./02-farmhouse-window-greenery.jpg" alt="02 farmhouse window greenery" />
      <figcaption>02 — Farmhouse window greenery<span>Busy island; quieter right wall for copy</span></figcaption>
    </figure>
    <figure>
      <img src="./03-mediterranean-herbs-citrus.jpg" alt="03 mediterranean herbs and citrus" />
      <figcaption>03 — Mediterranean herbs &amp; citrus<span class="rec">Recommended — soft left light for phone overlay</span></figcaption>
    </figure>
    <figure>
      <img src="./04-cottage-ivy-produce.jpg" alt="04 cottage ivy and produce" />
      <figcaption>04 — Cottage ivy &amp; produce<span>Most character; busiest — may need stronger overlay</span></figcaption>
    </figure>
    <figure>
      <img src="./05-butcher-block-basil-sun.jpg" alt="05 butcher block basil and sun" />
      <figcaption>05 — Butcher block, basil &amp; sun<span class="rec">Recommended — soft sunlit left space</span></figcaption>
    </figure>
  </main>
</body>
</html>
